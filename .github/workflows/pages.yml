# One GitHub Pages site with two versions:
#   /       the live site, from main:docs
#   /dev/   the development site, from dev:docs
# Runs when main or dev changes. Needs Settings → Pages → Source: GitHub Actions.
name: Pages (main + dev)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with: { ref: main, path: live }
      - name: Check out dev
        uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - name: Assemble the site
        run: |
          mkdir -p _site/dev
          cp -a live/docs/. _site/
          cp -a dev/docs/. _site/dev/
          touch _site/.nojekyll
          echo "live: $(git -C live rev-parse --short HEAD)  dev: $(git -C dev rev-parse --short HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
