; PlatformIO build for the RSOS wristband (firmware/BOARD_KIT.md).
;   pio run -e esp32dev -t upload && pio device monitor
; The sketch builds with Arduino-ESP32 2.x (PlatformIO's default) and 3.x (Arduino IDE).
[platformio]
src_dir = rsos_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DRSOS_MOTOR_PIN=5 -DRSOS_SCENT_PIN=6 -DRSOS_TASTE_PIN=7

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DRSOS_MOTOR_PIN=4 -DRSOS_SCENT_PIN=5 -DRSOS_TASTE_PIN=6
