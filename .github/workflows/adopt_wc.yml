name: adopt_wc
# spec/ADOPT_WC.md: the registered analysis on WildChat-1M. Prints aggregates only.
on:
  push:
    branches: [dev]
    paths:
      - "rsxv/rsxv/adopt_wc.py"
      - ".github/workflows/adopt_wc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub pyarrow numpy
      - name: ADOPT_WC (aggregates only)
        working-directory: rsxv
        run: python3 -m rsxv.adopt_wc
