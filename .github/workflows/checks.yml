name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fonts used to render the original glyphs
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-unifont fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: ./scripts/check_all.sh
