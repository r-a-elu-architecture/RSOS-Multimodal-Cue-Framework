name: RSOS v1.3 manual reproducibility check

# Deliberately manual: no push/pull-request scheduled runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/compositional-transfer-v1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s src/tests -v
      - name: Compiler contracts
        run: PYTHONPATH=src python src/compiler_stress.py
      - name: Consent and routing oracle
        run: PYTHONPATH=src python src/stress_test.py
      - name: Person/context-scoping oracle
        run: PYTHONPATH=src python src/scoped_stress.py --output results/scoped_stress_ci.json
      - name: Fast reproducibility smoke test
        run: PYTHONPATH=src python src/transfer_benchmark.py --seed 63011 --people 4 --calibration 24 --tests 4 --threshold 0.23 --output results/ci_smoke
