name: ctx_pref_hh
# spec/CTX_PREF_HH.md: the registered analysis on hh-rlhf helpfulness pairs. Prints aggregates only.
on:
  push:
    branches: [dev]
    paths:
      - "rsxv/rsxv/ctx_pref_hh.py"
      - ".github/workflows/ctx_pref_hh.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: CTX_PREF_HH (aggregates only)
        working-directory: rsxv
        run: python3 -m rsxv.ctx_pref_hh
